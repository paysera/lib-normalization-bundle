name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  phpunit:
    name: Run tests PHP ${{ matrix.php }} Symfony ${{ matrix.symfony }} ${{ matrix.dependency }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

      matrix:
        php:
          - '7.0'
          - '7.1'
          - '7.2'
          - '7.3'
          - '7.4'
          - '8.0'
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
        symfony:
          - '3.*'
          - '4.*'
          - '5.*'
          - '6.*'
        dependency:
          - 'highest'
        include:
          - { php: '7.0', symfony: '3.*', dependency: 'lowest' }
        exclude:
          - { php: '7.1', symfony: '5.*' }
          - { php: '7.1', symfony: '6.*' }
          - { php: '7.2', symfony: '6.*' }
          - { php: '7.3', symfony: '6.*' }
          - { php: '7.4', symfony: '6.*' }

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: flex

      # Composer refuses packages with security advisories by default since 2.9. The last Symfony 3.4 and 4.4 releases
      # of several components the tests install have them, and so do the Symfony 6.0 releases PHP 8.0 installs and the
      # PHPUnit 6.5 release PHP 7.2 installs. This only affects the test install here. The setting exists from Composer
      # 2.10, which setup-php installs for PHP 7.2 and later; PHP 7.0 and 7.1 get Composer 2.2, which does not block
      # advisories and does not know the setting.
      - name: Allow packages with security advisories
        if: matrix.php != '7.0' && matrix.php != '7.1'
        run: composer config policy.advisories.block false

      - name: Install dependencies
        uses: ramsey/composer-install@v2
        env:
          SYMFONY_REQUIRE: ${{ matrix.symfony }}
        with:
          dependency-versions: ${{ matrix.dependency }}

      - name: Run tests
        run: composer test
